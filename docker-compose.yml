services:
  api:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: financeflow
      JWT_SECRET: change-this-in-production
      CORS_ORIGIN: http://localhost:5500
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - financeflow-data:/data/db

volumes:
  financeflow-data:
